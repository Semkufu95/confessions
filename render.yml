services:
  - type: web
    name: confessions-backend
    env: docker
    plan: free
    autoDeploy: true
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: confessions-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: APP_VERIFY_EMAIL_BASE_URL
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"

databases:
  - name: confessions-db
    plan: free
